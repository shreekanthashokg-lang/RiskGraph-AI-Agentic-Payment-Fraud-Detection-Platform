name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Lint (ruff)
        run: ruff check backend/app ml scripts

      - name: Generate synthetic demo data
        run: python scripts/generate_synthetic_data.py --n-customers 300 --n-transactions 6000

      - name: Train model (smoke test - produces artifacts consumed by tests)
        run: python ml/train.py --data data/sample/transactions_synthetic.csv

      - name: Run backend unit tests
        working-directory: backend
        run: pytest -v --cov=app --cov-report=term-missing

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install
      - name: Type-check and build
        working-directory: frontend
        run: npm run build
